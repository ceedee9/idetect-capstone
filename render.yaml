services:
  - type: web
    name: idetect-api
    env: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm install
    startCommand: node scripts/migrate.js && node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: idetect-db
          property: connectionString

  databases:
    - name: idetect-db
      databaseName: idetect
      user: idetect
      plan: free
