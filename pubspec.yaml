name: idetect
description: OCR-based ID verification system for Senior Citizen and PWD IDs
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.5.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6

  # Camera & Images
  camera: ^0.11.3
  image_picker: ^1.1.2
  image: ^4.1.7

  # OCR - Multiple engines for best accuracy
  google_mlkit_text_recognition: ^0.11.0 # Fast, on-device
  google_mlkit_face_detection: ^0.9.0 # Face presence check on captured ID image
  flutter_tesseract_ocr: ^0.4.25 # Better for documents, highly accurate
  fuzzywuzzy: ^1.1.6 # Fuzzy string matching for name extraction

  # Advanced Image Processing
  opencv_dart: ^1.0.4 # Perspective correction, deskewing, morphological ops

  # State Management
  provider: ^6.1.1

  # Database - Local
  sqflite: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Database - Remote (Supabase - will add later)
  # supabase_flutter: ^2.3.0

  # Utilities
  intl: ^0.20.0 # Date formatting
  permission_handler: ^11.3.0 # Camera permissions
  uuid: ^4.3.3 # Generate unique IDs
  connectivity_plus: ^5.0.2 # Network connectivity detection
  url_launcher: ^6.3.1

  # UI Enhancement
  lottie: ^3.0.0 # Animations
  flutter_svg: ^2.0.10 # SVG support

  http: ^1.2.0

  shared_preferences: ^2.2.3
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/tessdata_config.json
    - assets/tessdata/
    # - assets/fonts/

  # Fonts (uncomment if you add custom fonts)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
